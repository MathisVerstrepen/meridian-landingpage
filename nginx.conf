server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Try to serve the file directly, then the directory's index.html, then custom 404
        try_files $uri $uri/index.html /404.html;
    }

    # Cache static assets (hashed filenames in _nuxt) for a long time
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Handle 404 errors using Nuxt's generated 404 page
    error_page 404 /404.html;
}